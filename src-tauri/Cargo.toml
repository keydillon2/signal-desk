[package]
name = "signal-desk"
version = "0.1.0"
description = "Category signals from public filings and news."
authors = ["Dillon Key"]
license = "MIT"
edition = "2021"

[lib]
name = "signal_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers", "gzip"] }
tauri-plugin-store = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
