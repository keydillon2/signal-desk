# Proof-of-concept build: checks the live data sources and builds a Mac app
# you can download from the run's "Artifacts". Informational, not a gate.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live data sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cloud runners are often blocked by these sources; informational only.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/smoke.mjs
        env:
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}

  mac:
    name: Mac app
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # to publish the "dev-build" pre-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles app
      # Zip with ditto so the app keeps its permissions and signature.
      - run: ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/Signal Desk.app" signal-desk-mac.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signal-desk-mac
          path: signal-desk-mac.zip
          retention-days: 14
      # Rolling pre-release so the newest build is always at the same URL.
      - name: Publish to the dev-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-build >/dev/null 2>&1 || gh release create dev-build --prerelease --title "Latest prototype build" --notes "Built automatically from main. Unsigned prototype; sample data."
          gh release upload dev-build signal-desk-mac.zip --clobber
